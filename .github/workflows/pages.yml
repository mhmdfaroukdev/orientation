name: Deploy Orientation Site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate static site
        run: |
          set -euo pipefail
          test -s index.html
          test -s styles.css
          test -s app.js
          node --check app.js
          grep -q 'id="registrationForm"' index.html
          grep -q 'id="submitFrame"' index.html
          grep -q 'script.google.com/macros/s/' app.js
          if grep -R -nE 'PASTE_|YOUR_[A-Z_]+|TODO_BACKEND' index.html styles.css app.js; then
            echo "Unresolved production placeholder found."
            exit 1
          fi

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js _site/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
